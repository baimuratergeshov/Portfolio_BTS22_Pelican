{% extends "base.html" %}
{% block title %}Auteurs{% endblock %}

{% block content %}
<div class="taxonomy-page">
  <h1>Auteurs</h1>
  <ul class="list-group taxonomy-list">
    {% for author, articles in authors %}
      <li class="list-group-item">
        <a href="{{ SITEURL }}/author/{{ author.slug }}.html">
          <span>{{ author.name }}</span>
          <span class="badge">{{ articles|length }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
