{% extends "base.html" %}
{% block title %}Tags{% endblock %}

{% block content %}
<div class="taxonomy-page">
  <h1>Tags</h1>
  <ul class="list-group taxonomy-list">
    {% for tag, articles in tags %}
      <li class="list-group-item">
        <a href="{{ SITEURL }}/tag/{{ tag.slug }}.html">
          <span>{{ tag.name }}</span>
          <span class="badge">{{ articles|length }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
